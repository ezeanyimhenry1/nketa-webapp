# MkDocs hackathon site. Not used by the web app Netlify site.
# Point a docs site at this file only if you want the submission docs, not the PWA.
[build]
  command = "pip install -r requirements-docs.txt && python3 scripts/build_docs.py && python3 -m mkdocs build"
  publish = "site"

[build.environment]
  PYTHON_VERSION = "3.11"
