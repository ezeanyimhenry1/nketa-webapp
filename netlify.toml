[build]
  command = "bash scripts/netlify_build_web.sh"
  publish = "build/web"

[build.environment]
  FLUTTER_CHANNEL = "stable"

[[headers]]
  for = "/firebase-messaging-sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
